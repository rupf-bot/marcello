<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Instrument Sans',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17161c"/>
      <stop offset="1" stop-color="#0f0e12"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- level captions -->
  <text x="60" y="238" fill="#fff" font-family="'Space Mono',monospace" font-size="20" letter-spacing="2">OUTCOME</text>
  <text x="60" y="410" fill="#fff" font-family="'Space Mono',monospace" font-size="20" letter-spacing="2">OPPORTUNITIES</text>
  <text x="60" y="561" fill="#fff" font-family="'Space Mono',monospace" font-size="20" letter-spacing="2">SOLUTIONS</text>
  <text x="60" y="690" fill="#fff" font-family="'Space Mono',monospace" font-size="20" letter-spacing="2">EXPERIMENTS</text>

  <!-- connecting lines: root -> opportunities -->
  <g stroke="rgba(115,127,223,.5)" stroke-width="3" fill="none">
    <path d="M855,290 C855,318 495,318 495,345"/>
    <path d="M855,290 C855,318 855,318 855,345"/>
    <path d="M855,290 C855,318 1215,318 1215,345"/>
  </g>

  <!-- opportunities -> solutions (from middle opportunity) -->
  <g stroke="rgba(115,127,223,.5)" stroke-width="2.5" fill="none">
    <path d="M855,449 C855,478 695,478 695,504"/>
    <path d="M855,449 C855,478 1015,478 1015,504"/>
  </g>

  <!-- solutions -> experiments -->
  <g stroke="rgba(255,255,255,.32)" stroke-width="2.5" fill="none">
    <path d="M695,592 C695,620 660,620 660,647"/>
    <path d="M695,592 C695,620 730,620 730,647"/>
    <path d="M1015,592 C1015,620 980,620 980,647"/>
    <path d="M1015,592 C1015,620 1050,620 1050,647"/>
  </g>

  <!-- root node: OUTCOME -->
  <rect x="665" y="160" width="380" height="130" rx="65" fill="#737FDF"/>
  <text x="855" y="239" fill="#fff" font-size="38" font-weight="700" text-anchor="middle" letter-spacing="1">Outcome</text>

  <!-- opportunity nodes -->
  <g>
    <rect x="345" y="345" width="300" height="104" rx="52" fill="rgba(115,127,223,.18)" stroke="rgba(115,127,223,.65)" stroke-width="2"/>
    <text x="495" y="406" fill="#fff" font-size="24" text-anchor="middle">Opportunity A</text>

    <rect x="705" y="345" width="300" height="104" rx="52" fill="rgba(115,127,223,.3)" stroke="#737FDF" stroke-width="2"/>
    <text x="855" y="406" fill="#fff" font-size="24" font-weight="600" text-anchor="middle">Opportunity B</text>

    <rect x="1065" y="345" width="300" height="104" rx="52" fill="rgba(115,127,223,.18)" stroke="rgba(115,127,223,.65)" stroke-width="2"/>
    <text x="1215" y="406" fill="#fff" font-size="24" text-anchor="middle">Opportunity C</text>
  </g>

  <!-- solution nodes -->
  <g>
    <rect x="575" y="504" width="240" height="88" rx="44" fill="rgba(255,255,255,.07)" stroke="rgba(255,255,255,.45)" stroke-width="1.8"/>
    <text x="695" y="556" fill="#fff" font-size="21" text-anchor="middle">Solution 1</text>

    <rect x="895" y="504" width="240" height="88" rx="44" fill="rgba(255,255,255,.07)" stroke="rgba(255,255,255,.45)" stroke-width="1.8"/>
    <text x="1015" y="556" fill="#fff" font-size="21" text-anchor="middle">Solution 2</text>
  </g>

  <!-- experiment leaf nodes -->
  <g fill="#0f0e12" stroke="#737FDF" stroke-width="2.5">
    <circle cx="660" cy="677" r="30"/>
    <circle cx="730" cy="677" r="30"/>
    <circle cx="980" cy="677" r="30"/>
    <circle cx="1050" cy="677" r="30"/>
  </g>
  <g fill="rgba(255,255,255,.8)" font-family="'Space Mono',monospace" font-size="15" text-anchor="middle">
    <text x="660" y="731">TEST</text>
    <text x="730" y="731">TEST</text>
    <text x="980" y="731">TEST</text>
    <text x="1050" y="731">TEST</text>
  </g>
</svg>
